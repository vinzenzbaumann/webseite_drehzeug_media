<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <title>drehzeug media – Coming soon</title>
  <style>
    @font-face {
      font-family: "Cooper Hewitt";
      src: url("assets/fonts/cooper-hewitt-latin-500-normal.woff2") format("woff2");
      font-style: normal;
      font-weight: 500;
      font-display: swap;
    }

    @font-face {
      font-family: "Cooper Hewitt";
      src: url("assets/fonts/cooper-hewitt-latin-800-normal.woff2") format("woff2");
      font-style: normal;
      font-weight: 800;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      position: relative;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      background: #111;
      color: #fff;
      font-family: "Cooper Hewitt", Arial, sans-serif;
    }

    .background-video,
    .background-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .background-video {
      object-fit: cover;
      filter: grayscale(1) blur(clamp(24px, 6vw, 80px)) contrast(1.05);
      transform: scale(1.12);
    }

    .background-overlay {
      background: rgba(0, 0, 0, 0.18);
    }

    .coming-soon {
      position: relative;
      z-index: 1;
      width: min(100% - 32px, 1400px);
      text-align: center;
    }

    .logo {
      display: inline-flex;
      max-width: 100%;
      flex-direction: column;
      align-items: stretch;
      font-size: clamp(2.4rem, 12.5vw, 12rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: 0.055em;
      white-space: nowrap;
    }

    .logo-media {
      align-self: flex-end;
      margin-top: 0.18em;
      font-size: 0.28em;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.2em;
    }

    .coming-soon-label {
      margin: clamp(2.5rem, 8vh, 5rem) 0 0;
      font-size: clamp(0.9rem, 1.8vw, 1.2rem);
      font-weight: 500;
      letter-spacing: 0.38em;
    }

    @media (max-width: 360px) {
      .logo {
        font-size: clamp(2rem, 11vw, 2.4rem);
      }

      .coming-soon-label {
        letter-spacing: 0.25em;
      }
    }
  </style>
</head>
<body>
  <video class="background-video" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
    <source src="assets/ressource/psycho-stream.mp4" type="video/mp4" />
  </video>
  <div class="background-overlay" aria-hidden="true"></div>
  <main class="coming-soon">
    <h1 class="logo">
      <span>DREHZEUG</span>
      <span class="logo-media">media</span>
    </h1>
    <p class="coming-soon-label">COMING SOON</p>
  </main>
</body>
</html>
